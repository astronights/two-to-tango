<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tango">
  <meta name="description" content="Practice the LinkedIn Tango puzzle game offline">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Tango</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Tango</h1>
      <div class="difficulty-toggle">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn active" data-diff="medium">Medium</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
      </div>
    </header>

    <div id="message" class="hidden"></div>

    <div id="grid-container">
      <div id="grid"></div>
    </div>

    <div class="controls">
      <button id="new-game">New Game</button>
    </div>

    <div class="legend">
      <span class="legend-item">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4.5" fill="#FBBF24"/>
          <g stroke="#FBBF24" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="2"    x2="12" y2="5"/>
            <line x1="12" y1="19"   x2="12" y2="22"/>
            <line x1="2"  y1="12"   x2="5"  y2="12"/>
            <line x1="19" y1="12"   x2="22" y2="12"/>
            <line x1="4.93" y1="4.93"   x2="7.05" y2="7.05"/>
            <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
            <line x1="4.93"  y1="19.07" x2="7.05"  y2="16.95"/>
            <line x1="16.95" y1="7.05"  x2="19.07" y2="4.93"/>
          </g>
        </svg>
        Sun
      </span>
      <span class="legend-item">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#A78BFA"/>
        </svg>
        Moon
      </span>
      <span class="legend-item constraint-legend">= same &nbsp; × diff</span>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
